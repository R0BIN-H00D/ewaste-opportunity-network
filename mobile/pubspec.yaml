name: ewaste_opportunity
description: E-Waste-to-Opportunity Network — Android app (shares one backend with the web app).
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.2
  dio: ^5.7.0
  flutter_secure_storage: ^9.2.2
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  image_picker: ^1.1.2
  geolocator: ^13.0.2
  # Firebase is initialised in Phase 8 (needs google-services.json, which is git-ignored)
  firebase_core: ^3.8.1
  firebase_messaging: ^15.1.6
  socket_io_client: ^3.0.2
  fl_chart: ^0.70.0
  cached_network_image: ^3.4.1
  material_ui: ^1.11.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
  # Enable after adding the OFL font files (see docs/ASSETS.md):
