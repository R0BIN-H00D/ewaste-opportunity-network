<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Transform electronic waste into opportunities through repair, reuse, donation and responsible recycling." />
    <meta name="theme-color" content="#14532D" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>E-Waste-to-Opportunity Network</title>
    <script>
      // Apply saved/OS theme before first paint to avoid a flash.
      try {
        var t = localStorage.getItem('theme');
        if (t === 'dark' || (!t && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.add('dark');
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
